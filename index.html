  log((dark?"🌑 Day ":"☀️ Day ")+S.day+" ends: "+(dark?(S.world==="mars"?"dust storm, little sunlight":"no sunlight"):"solar +"+gen+" power ("+Math.round(S.dust)+"% dust)")+", base used "+use+". Radiation +"+rb+" mSv.");
  S.dust=clamp(S.dust+W().dustAdd);clampRes();
  if(S.modules.length){const out=[];for(const m of S.modules){const k=MODK[m.t];for(const f in k.fx){const v=k.fx[f];if(f==="spower"){r.power=clamp(r.power+v*solarFactor(),0,capP())}else if(f==="sp")S.sp+=v;else if(f==="radd")S.rad=Math.max(0,Math.round((S.rad+v)*10)/10);else if(f==="dustd")S.dust=clamp(S.dust+v);else if(f.startsWith("m_"))S.mat[f.slice(2)]=(S.mat[f.slice(2)]||0)+v;else if(["armor","walk","cap","prot","warn","eva","buildx","cargo"].includes(f))continue;else r[f]=f==="power"?clamp(r[f]+v,0,capP()):clamp(r[f]+v)}out.push(k.icon)}if(out.length)log("🏗️ Modules worked all day: "+out.slice(0,12).join(" ")+(out.length>12?" +"+(out.length-12):""));clampRes()}
  S.sp+=5;log("🛰️ Mission Control grant: +5 SP");
  const e=pickEvent("night");S.ev={id:e.id,chosen:null,fx:"",kind:"night"};S.phase="event";save();go("event")}
/* ============ EVENTS ============ */
function renderEvent(){
  const e=evOf(S.ev.id),ch=S.ev.chosen,k=S.ev.kind,t=ETYPE[e.type]||ETYPE.env;
  const lead=k==="night"?"Night "+S.day:k==="eva"?"EVA incident":"Morning, Day "+S.day;
  let b=`<div class="hudcard">${hudHTML()}</div><div class="card"><div class="row"><span class="tag" style="font-size:.85rem">${t[0]} ${t[1]}</span><span class="tag bad" style="font-size:.85rem">${k==="eva"?"incident outside":"major problem"}</span></div><h2>${e.icon} ${lead}: ${esc(e.title)}</h2>${eventArt(e,k)}<p>${esc(e.text)}</p>${LOSTEV[e.id]?`<p class="small bad">🕯️ This hazard killed the crew of Outpost ${LOSTEV[e.id]} “${esc(STORIES[LOSTEV[e.id]-1].name)}”.</p>`:""}`;
  if(ch===null)b+=`<p class="muted small">Choose one. Every option costs something.</p>`+e.opts.map((o,i)=>`<button class="opt" onclick="chooseOpt(${i})">${esc(o.l)}<span class="ctx">${esc(o.ctx)}</span></button>`).join("");
  else b+=`<p><b>You chose:</b> ${esc(e.opts[ch].l)}</p><p class="${S.ev.fx?"":"muted"}">${S.ev.fx||"No change."}</p><div class="debrief"><b>${esc(e.real[0])}</b><br>${esc(e.real[1])}</div><button class="primary" onclick="afterEvent()">${k==="night"?"Continue into the night →":"Continue →"}</button>`;
  return b+`</div>`}
function chooseOpt(i){const e=evOf(S.ev.id),o=e.opts[i];S.ev.chosen=i;S.ev.fx=applyFx(o.fx,MD().sev,e.prot);S.evLog.push(e.id);log(e.icon+" "+e.title+": "+o.l);save();render()}
function afterEvent(){
  const k=S.ev.kind,after=S.ev.after;
  if(k==="night"){toNight();return}
  S.ev=null;S.phase="day";save();
  if(checkFail())return;
  if(k==="eva"){go("day");arriveAt(after);return}
  go("day")}
function toNight(){resolveNight();S.phase=S.over?"end":"night";save();go("night")}
function resolveNight(){
  const m=MD(),dr=m.dr,r=S.res,L=[];
  const d={o2:Math.round(NIGHT.o2*dr),water:Math.round(NIGHT.water*dr),food:Math.round(NIGHT.food*dr),power:nightPower()};
  r.o2-=d.o2;r.water-=d.water;r.food-=d.food;r.power-=d.power;r.morale-=NIGHT.morale;
  L.push(`Night uses: 🫧 -${d.o2}  💧 -${d.water}  🍲 -${d.food}  ⚡ -${d.power} (heaters)  🙂 -${NIGHT.morale}`);
  let cause=null;
  if(r.power<0){r.power=0;r.health-=30;L.push("❄️ Power ran out and the heaters switched off. The habitat froze: health -30.");cause="power"}
  if(r.water<=0){r.water=0;r.health-=25;L.push("🏜️ Out of water: health -25.");cause="water"}
  if(r.food<=0){r.food=0;r.health-=15;L.push("🍽️ Out of food: health -15.");cause="food"}
  if(r.morale<=0){r.morale=0;r.health-=10;L.push("😞 Morale hit zero: health -10.");cause="morale"}
  if(S.rad>=120){const h=Math.round((S.rad>=180?4:2)*m.sev);r.health-=h;L.push("☢️ Radiation sickness at "+Math.round(S.rad)+" mSv: nausea and fatigue, health -"+h+".");cause=cause||"radiation"}
  if(r.o2<=0){r.o2=0;L.push("🫧 The oxygen ran out.");S.over={win:false,cause:"o2",why:"oxygen"}}
  if(S.rad>=RADMAX&&!S.over)S.over={win:false,cause:"rad",why:"radiation"};
  if(r.health<=0&&!S.over)S.over={win:false,cause:"health",why:cause||"health"};
  if(m.free){S.over=null;for(const k in r)r[k]=Math.max(r[k],k==="health"?10:5)}
  clampRes();
  if(!S.over){
    if(S.day>=NIGHTS){if(S.loaded.length>=m.samp){S.over={win:true};ES=0;S.sp+=50+S.loaded.length*10;L.push("🌅 Dawn on Day "+(NIGHTS+1)+". You survived all "+NIGHTS+" days! +"+(50+S.loaded.length*10)+" SP")}else{S.over={win:false,incomplete:true};L.push("🌅 Dawn on Day "+(NIGHTS+1)+". You survived, but only "+S.loaded.length+" of "+m.samp+" samples were delivered.")}}
    else{S.day++;phaseNotes(L);
      const lowM=r.morale<25?2:0;S.energy=Math.max(2,m.en-S.penalty-lowM);if(lowM)L.push("😞 Low morale: 2 fewer hours of energy tomorrow.");if(S.penalty)L.push("🔧 Repairs from the event: -"+S.penalty+" hours tomorrow.");S.penalty=0}}
  S.report=L;log("🌙 Night "+(S.over?S.day:S.day-1)+" complete.")}
function renderNight(){
  return `<div class="hudcard">${hudHTML()}</div><div class="card"><h2>🌙 Night ${S.over?S.day:S.day-1} report</h2>${baseScene(true)}<div class="log" style="max-height:none">${S.report.map(l=>`<p>${esc(l)}</p>`).join("")}</div>${S.over?`<button class="primary" onclick="go('end')">See the result →</button>`:`<button class="primary" onclick="startDay()">☀️ Start Day ${S.day} →</button>`}</div>`}

function phaseNotes(L){
  const d=S.day;
  if(S.world==="mars"){(S.storms||[]).forEach(r=>{
    if(d===r[0]-1)L.push("🌪️ A dust storm is building on the horizon. Tomorrow the Sun will be hidden for "+(r[1]-r[0]+1)+" sols.");
    if(d===r[0])L.push("🌪️ The dust storm begins. For "+(r[1]-r[0]+1)+" sols solar panels make almost no power.");
    if(d===r[1]+1)L.push("🌅 The dust storm is over. The sky clears and solar panels work again.")});return}
  const st=siteOf();
  if(d===st.dark[0]-1)L.push("🌇 Sunset is near. Tomorrow the long dark begins, with no sunlight for "+(st.dark[1]-st.dark[0]+1)+" days.");
  if(d===st.dark[0])L.push("🌑 The dark days begin. No sunlight for "+(st.dark[1]-st.dark[0]+1)+" days and about -173 °C outside. Solar panels make no power.");
  if(d===st.dark[1]+1)L.push("🌅 Sunrise! The Sun is back and solar panels work again.")}

let ES=0;
function capsuleSVG(){return `<path d="M-14,10 L-9,-22 Q0,-34 9,-22 L14,10Z" fill="#eceff8" stroke="#8a90a8"/><path d="M-14,10 L14,10 L10,16 L-10,16Z" fill="#6b4a2a"/><circle cx="0" cy="-8" r="4" fill="#60a5fa"/><path d="M-9,-22 L9,-22" stroke="#cbd0e6"/>`}
function endSceneLift(){return `<svg viewBox="0 0 800 340" class="scene" role="img" aria-label="Return capsule lifting off"><defs><linearGradient id="ls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02040f"/><stop offset="1" stop-color="#1a2760"/></linearGradient><radialGradient id="le" cx=".35" cy=".35"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#1e4fa8"/></radialGradient></defs><rect width="800" height="340" fill="url(#ls)"/>${starsSVG(80,800,340,13)}<circle cx="640" cy="80" r="34" fill="url(#le)"/><path d="M0,290 Q200,262 400,285 T800,280 V340 H0Z" fill="#6a6e8a"/><rect y="300" width="800" height="40" fill="#585c78"/><ellipse cx="400" cy="302" rx="70" ry="8" fill="rgba(0,0,0,.3)"/><g class="rise"><g transform="translate(400,282) scale(1.6)">${capsuleSVG()}<path class="flame" d="M-6,16 L0,44 L6,16Z" fill="#fb923c"/><path class="flame" d="M-3,16 L0,32 L3,16Z" fill="#fde047"/></g></g><circle class="puff" cx="400" cy="292" r="26" fill="#ddd" opacity=".5"/><circle class="puff" cx="360" cy="296" r="18" fill="#ddd" opacity=".4"/><circle class="puff" cx="440" cy="296" r="18" fill="#ddd" opacity=".4"/></svg>`}
function endSceneSplash(){return `<svg viewBox="0 0 800 340" class="scene" role="img" aria-label="Capsule splashing down in the ocean"><defs><linearGradient id="ss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#f9b27c"/></linearGradient></defs><rect width="800" height="340" fill="url(#ss)"/><circle cx="130" cy="210" r="30" fill="#ffe08a" opacity=".9"/><rect y="230" width="800" height="110" fill="#1d4f91"/><path d="M0,236 Q50,228 100,236 T200,236 T300,236 T400,236 T500,236 T600,236 T700,236 T800,236" stroke="#8cc4ff" stroke-width="2" fill="none"/><g transform="translate(640,236)"><path d="M-70,0 L70,0 L55,22 L-55,22Z" fill="#cfd3e6"/><rect x="-20" y="-24" width="40" height="24" fill="#e5e7eb"/><rect x="-6" y="-38" width="3" height="14" fill="#cbd0e6"/><rect x="-24" y="-8" width="10" height="6" fill="#60a5fa"/></g><g class="fall"><g transform="translate(330,150)"><path d="M-70,-90 Q-35,-140 0,-90 Q35,-140 70,-90" fill="none"/><path d="M-60,-62 Q-30,-120 0,-62Z" fill="#f97316"/><path d="M0,-62 Q30,-120 60,-62Z" fill="#fff"/><path d="M-20,-66 Q0,-96 20,-66Z" fill="#f97316"/><path d="M-55,-62 L-6,10 M55,-62 L6,10 M0,-62 L0,10" stroke="#ddd" stroke-width="1.2"/><g transform="translate(0,26) scale(1.2)">${capsuleSVG()}</g></g></g></svg>`}
function rankOf(){const r=S.res,avg=(r.o2+r.water+r.food+r.power+r.health+r.morale)/6;return avg>=70?["🥇","Gold: Commander of Outpost 7"]:avg>=45?["🥈","Silver: Outpost 7 Operator"]:["🥉","Bronze: Outpost 7 Survivor"]}
function renderEnd(){
  const o=S.over,evs=[...new Set(S.evLog)].map(id=>evOf(id)),cards=evs.map(e=>`<div class="debrief"><b>${e.icon} ${esc(e.real[0])}</b><br>${esc(e.real[1])}</div>`).join("");
  if(o.win){
    const nav=(n,l)=>`<div class="row" style="margin-top:10px"><button class="primary" onclick="ES=${n};render()">${l}</button></div>`;
    if(ES===0)return `<div class="card"><h2>🏅 Survived ${NIGHTS} days!</h2>${baseScene(false)}<p class="good"><b>Days survived: ${NIGHTS} of ${NIGHTS}</b></p><p>Dawn breaks on Day ${NIGHTS+1}. The radio crackles: <i>"Outpost 7, this is Mission Control. We have your signal. Six crews came before you, and none lasted the week. You are the first to survive."</i></p><p>Oxygen ${S.res.o2} · Water ${S.res.water} · Food ${S.res.food} · Power ${S.res.power} · Health ${S.res.health} · Morale ${S.res.morale}</p><p>Your ${S.loaded.length} rock samples are sealed in the return capsule.</p>${nav(1,"🚀 Launch the return capsule →")}</div>`;
    if(ES===1)return `<div class="card"><h2>🚀 Liftoff</h2>${endSceneLift()}<p>${S.world==='mars'?'The ascent vehicle fires its engine and climbs through the thin Martian air. Your samples begin the long trip home, about seven months away.':'The capsule fires its engine. With only one sixth of Earth\'s gravity and no air, it climbs fast and silent. Your samples are heading home.'}</p>${nav(2,"🌍 Return to Earth →")}</div>`;
    if(ES===2)return `<div class="card"><h2>🌊 Splashdown</h2>${endSceneSplash()}<p>Days later the capsule hits Earth's air at about 11 km/s. The heat shield glows, parachutes open and the capsule splashes down. A recovery ship hoists it aboard.</p>${nav(3,"🔬 Lab results →")}</div>`;
    const rk=rankOf();
    return `<div class="card"><h2>🔬 Mission complete: the lab results</h2><p>Scientists open your sample tubes:</p><div class="grid">${S.loaded.map(id=>{const t=SAMPLES.find(x=>x.id===id);return `<div class="card" style="margin:0"><h3>${t.icon} ${esc(t.n)}</h3><p class="small">${esc(t.fact)}</p></div>`}).join("")}</div>
    <div class="debrief"><b>${rk[0]} ${rk[1]}</b><br>Survived ${NIGHTS} of ${NIGHTS} days with ${S.loaded.length} sample${S.loaded.length===1?"":"s"} delivered. Final Science Points: <b>${S.sp}</b></div>
    <div class="debrief"><b>🕯️ In memory of the Six Lost Crews</b><br>${STORIES.map(st=>"Outpost "+st.n+" “"+esc(st.name)+"”: "+st.crew.map(esc).join(", ")).join("<br>")}<br><br>Outpost 7 carried their research home. You read ${storiesFound()} of their 6 logs.</div><h3>The real missions behind your nights</h3>${cards||"<p class='muted'>No events recorded.</p>"}
    <div class="row" style="margin-top:10px"><button class="primary" onclick="go('modes')">Play again</button><button onclick="ES=0;render()">Replay ending</button><button onclick="go('home')">Home</button></div></div>`}
  if(o.incomplete)return `<div class="card"><h2>🌑 Survived, but the mission is incomplete</h2>${baseScene(false)}<p class="good"><b>Days survived: ${NIGHTS} of ${NIGHTS}</b></p><p>You lived through all ${NIGHTS} days, but Mission Control needed <b>${MD().samp} rock samples</b> loaded in the return capsule and you only delivered <b>${S.loaded.length}</b>. The science was the whole reason for Outpost 7.</p><p class="muted">Next time, collect samples at the field site early and load them at the landing pad.</p><h3>What the real missions teach</h3>${cards||"<p class='muted'>No events recorded.</p>"}<div class="row" style="margin-top:10px"><button class="primary" onclick="pickMode('${S.mode}')">Try again</button><button onclick="go('modes')">Change mode</button><button onclick="go('home')">Home</button></div></div>`;
  const f=FAIL[o.cause]||FAIL.health;
  return `<div class="card"><h2>💥 Outpost 7 was lost on night ${S.day}</h2>${baseScene(true)}<p><b>${esc(f[0])}.</b> ${esc(f[1])}</p><p class="muted">Cause chain: ${esc(o.why)}.</p><h3>What the real missions teach</h3>${cards||"<p class='muted'>No events recorded.</p>"}<div class="row" style="margin-top:10px"><button class="primary" onclick="pickMode('${S.mode}')">Try again</button><button onclick="go('modes')">Change mode</button><button onclick="go('home')">Home</button></div></div>`}

/* ============ ARRIVAL ============ */
function pickMode(k){S=fresh();S.world=WSEL;S.storms=S.world==="mars"?makeStorms():null;applyWorld();S.mode=k;S.phase="lore";S.energy=MODES[k].en;save();go("lore")}
function renderLore(){
  return `<div class="card"><h2>📜 Outpost 7: mission briefing</h2><p class="muted">In this story, six outposts on ${W().n} were built before yours. Every crew was lost within the first week. Mission Control calls this the Six Lost Crews. Their wrecks are scattered across ${W().short==="Moon"?"the Moon":"Mars"}, and their last logs are still waiting to be found.</p>
  <div class="grid">${STORIES.map(st=>`<div class="card" style="margin:0"><h3>🕯️ Outpost ${st.n} “${esc(st.name)}”</h3><p class="small muted">${st.crew.map(esc).join(" · ")}</p><p class="small muted">Lost on night ${st.night}</p><p class="small">${esc(st.head)}</p></div>`).join("")}</div>
  <p>Outpost 7 is yours. <b>Survive ${NIGHTS} days ${S.world==="mars"?"(about 30 sols)":"(a full lunar cycle)"} and bring home ${MD().samp} rock samples.</b> Every day you will make choices. Major problems will strike often, and radiation from the Sun and deep space adds up. Stay under ${RADMAX} mSv, keep your six survival meters above zero, and learn from the six crews who came before you.</p>
  <button class="primary" onclick="startTraining()">🎓 Start astronaut training →</button><button class="sm" onclick="go('howto')">🎮 How to play</button><button class="sm" onclick="openManual()">📖 Manual</button></div>`}
/* ============ QUIZ ============ */
function startQuiz(){if(S.energy<1){toast("Not enough hours left today.");return}S.energy--;S.res.morale=clamp(S.res.morale+3);save();Q={qs:[...QUIZ].sort(()=>rnd()-.5).slice(0,5),i:0,right:0,picked:null,pts:0};go("quiz")}
function renderQuiz(){
  if(Q.i>=Q.qs.length)return '<div class="card"><h2>Quiz complete!</h2><p>You got <b>'+Q.right+'/'+Q.qs.length+'</b> and earned <b>'+Q.pts+' SP</b>.</p><button class="primary" onclick="S.tab=\'mission\';go(\'day\')">Back to the outpost</button></div>';
  const q=Q.qs[Q.i];
  return '<div class="card"><h2>❓ Quiz '+(Q.i+1)+'/'+Q.qs.length+'</h2><p><b>'+esc(q.q)+'</b></p>'+q.a.map((x,j)=>'<button class="opt '+(Q.picked!==null&&j===q.c?'sel':'')+'" '+(Q.picked!==null?'disabled':'')+' onclick="answerQ('+j+')">'+esc(x)+'</button>').join("")+(Q.picked!==null?'<div class="debrief">'+(Q.picked===q.c?'<b class="good">Correct! +'+q.v+' SP</b>':'<b class="bad">Not quite.</b>')+' '+esc(q.e)+'</div><button class="primary" onclick="Q.i++;Q.picked=null;render()">Next →</button>':'')+'</div>'}
function answerQ(j){const q=Q.qs[Q.i];Q.picked=j;if(j===q.c){Q.right++;Q.pts+=q.v;S.sp+=q.v;save()}render()}
/* ============ MODES SCREEN ============ */
function modes(){
  return '<div class="card"><h2>Choose your training mode</h2><p class="muted">Survive '+NIGHTS+' days at Outpost 7. '+(S.mode&&S.phase!=="home"?'Starting a new outpost erases your current one.':'Pick how tough Mission Control should be.')+'</p></div><div class="grid">'+Object.keys(MODES).map(k=>{const m=MODES[k];return '<div class="card" style="margin:0"><h3>'+m.icon+' '+m.n+'</h3><p class="small muted">'+m.tag+'</p><p class="small">'+esc(m.desc)+'</p><button class="primary" onclick="pickMode(\''+k+'\')">Start '+m.n+'</button></div>'}).join("")+'</div><div class="row" style="margin-top:12px"><button onclick="go(\'home\')">🏠 Home</button></div>'}
/* ============ HOME ============ */
function resume(){const p=S.phase;go(p==="lore"?"lore":p==="training"?"training":p==="howto"?"howto":p==="event"?"event":p==="night"?"night":p==="end"?"end":"day")}
function renderHome(){
  const has=!!S.mode&&S.phase!=="home",info=has?`${MD().icon} ${MD().n} · Day ${Math.min(S.day,NIGHTS)} of ${NIGHTS} · ${S.sp} SP`:"No saved outpost yet";
  return `<div class="home-wrap"><svg class="home-stars" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${starsSVG(160,1000,1500,11)}${starsSVG(80,1000,1500,29)}</svg>
   <h1 class="home-title">OUTPOST 7</h1><p class="home-sub">Six crews were lost. Survive a month on the Moon or Mars.</p>
   ${home()}
   <p class="home-order">Mercury · Venus · Earth · Mars · Jupiter · Saturn · Uranus · Neptune</p>
   <div class="home-btns"><button class="hbtn primary" onclick="go('drama')">🚀 New Outpost</button><button class="hbtn" ${has?"":"disabled"} onclick="resume()">Continue Outpost</button></div>
   <p class="home-info">${esc(info)}</p></div>`}
/* ============ RENDER ============ */
function chips(){$("#chips").innerHTML=S.mode&&S.phase!=="home"?`<span class="chip">${W().icon} ${W().short}</span><span class="chip">${MD().icon} ${MD().n}</span><span class="chip">📅 Day ${Math.min(S.day,NIGHTS)}/${NIGHTS}</span><span class="chip">⭐ ${S.sp} SP</span>`:""}
function render(){
  stopLive();stopDrama();chips();document.body.classList.toggle("home",V==="home"||V==="drama");
  const f={home:renderHome,modes,lore:renderLore,world:renderWorld,drama:renderDrama,training:renderTraining,howto:renderHowTo,manual:renderManual,day:renderDay,event:renderEvent,night:renderNight,end:renderEnd,quiz:renderQuiz}[V];
  $("#app").innerHTML=f();if(V==="day"&&S.tab==="build"){bRefresh()}if(V==="day"&&S.tab==="data"){startLive()}if(V==="drama"){startDrama()}}
applyWorld();V="home";render();

</script>
</body>
