<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpost 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--panel:#111a3d;--panel2:#1a2656;--text:#eaf0ff;--muted:#9aa8d8;--accent:#ffb347;--good:#4ade80;--bad:#f87171;--blue:#60a5fa;--line:#2b3a78}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#16215a 0,#070b1f 60%) fixed;color:var(--text);font:15px/1.6 Audiowide,"Times New Roman",serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(7,11,31,.85);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem;letter-spacing:.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem}
main{max-width:1000px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Audiowide,"Times New Roman",serif;font-weight:400;letter-spacing:.03em}b,strong{font-weight:400;color:#fff}h2{margin:.2em 0 .4em}h3{margin:.2em 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
button{font:inherit;font-weight:400;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1b1200;border-color:var(--accent);font-weight:700}
button.sm{padding:4px 10px;font-size:.85rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.good{color:var(--good)}.bad{color:var(--bad)}
.opt{display:block;text-align:left;width:100%;margin:6px 0}
.opt.sel{border-color:var(--accent);background:#2a2f63}
.opt .ctx{display:block;color:var(--muted);font-size:.85rem}
.bar{height:12px;background:#0a1030;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--good);transition:width .3s}
.bar.warn>i{background:var(--accent)}.bar.danger>i{background:var(--bad)}.bar.blue>i{background:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.stages{display:flex;gap:8px;margin:6px 0}
.stages div{flex:1;text-align:center;padding:6px;border-radius:8px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.stages .on{border-color:var(--accent);color:var(--text);background:#2a2f63}.stages .done{color:var(--good);border-color:var(--good)}
.map{position:relative;height:90px;margin:14px 6px 24px;border-bottom:3px dashed var(--line)}
.map .pt{position:absolute;bottom:-4px;transform:translateX(-50%);text-align:center;font-size:.75rem}
.map .pt span{display:block;font-size:1.4rem}
.map .rv{position:absolute;bottom:22px;transform:translateX(-50%);font-size:1.8rem;transition:left .5s}
.log{max-height:170px;overflow:auto;background:#0a1030;border-radius:10px;padding:8px 12px;font-size:.9rem}
.log p{margin:2px 0}.log .ev{color:var(--accent)}.log .er{color:var(--bad)}.log .ok{color:var(--good)}
.debrief{border-left:4px solid var(--accent);background:#0f1740;padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0}
canvas{width:100%;max-width:700px;background:#02040f;border:1px solid var(--line);border-radius:10px;display:block;touch-action:none}
select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1b1200;font-weight:700;padding:8px 18px;border-radius:999px;z-index:9;box-shadow:0 4px 20px #0008}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--muted)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.home-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-family:Audiowide,"Times New Roman",serif;padding-block:8px}
.home-stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.home-stars circle{animation:tw 4s ease-in-out infinite}.home-stars circle:nth-child(3n){animation-delay:-1.3s}.home-stars circle:nth-child(5n){animation-delay:-2.6s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.home-title{margin:0;font-size:clamp(1.8rem,6vw,3.2rem);letter-spacing:.12em;font-family:inherit;color:#fff}
.home-sub{margin:0;color:#9aa8d8;letter-spacing:.2em;font-size:.85rem;text-transform:uppercase}
.solar{width:min(100%,62vh,640px);height:auto;display:block}
.home-order{margin:0;color:#7e8ab8;font-size:.72rem;letter-spacing:.08em}
.home-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.hbtn{font-family:Audiowide,"Times New Roman",serif;font-weight:400;font-size:1.05rem;letter-spacing:.08em;padding:12px 26px;border-radius:999px;background:#000;border:2px solid #60a5fa;color:#eaf0ff;box-shadow:0 0 18px #60a5fa55}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#1b1200;box-shadow:0 0 22px #ffb34777}
.hbtn:hover:not(:disabled){transform:translateY(-2px)}
.home-info{margin:0;color:#9aa8d8;font-size:.85rem}
body.home{background:#000}body.home header{display:none}
@media(prefers-reduced-motion:reduce){.home-stars circle{animation:none}}
.scene{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;margin:8px 0}
.streak{animation:drift 1.3s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(880px)}}
@media(prefers-reduced-motion:reduce){.streak{animation:none}}
@media(max-width:600px){main{padding:10px}.stages div{font-size:.7rem}}
body.wide main{max-width:none;padding:6px 8px}body.nosb .side{display:none}body.nosb .play{grid-template-columns:1fr}
.play{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start}
.stage{position:relative}
#wc{width:100%;max-width:none;height:auto;aspect-ratio:900/540;border:1px solid var(--line);border-radius:12px;background:#0a0d1c;display:block;touch-action:none;cursor:pointer}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,36px);gap:4px}
.dpad button{padding:0;touch-action:none}#dU{grid-column:2}#dL{grid-column:1;grid-row:2}#dD{grid-column:2;grid-row:2}#dR{grid-column:3;grid-row:2}
.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,380px);max-height:80%;overflow:auto;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:12px;z-index:3;box-shadow:0 10px 40px #000a}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0}
.tabsrow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.sidelist{max-height:340px;overflow:auto;padding-right:2px}
.sidelist .opt{margin:4px 0;padding:6px 10px}
@media(max-width:900px){.play{grid-template-columns:1fr}.side{position:static}}
.rise{animation:rise 6s ease-in forwards}.fall{animation:fall 6s ease-out forwards}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-420px)}}
@keyframes fall{from{transform:translateY(-200px)}to{transform:translateY(60px)}}
.flame{transform-origin:50% 0;animation:fl .15s ease-in-out infinite alternate}@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}
.puff{animation:pf 3s ease-out forwards}@keyframes pf{from{transform:scale(.6);opacity:.6}to{transform:scale(2.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.rise,.fall,.flame,.puff{animation:none}}
.stage{position:relative;height:calc(100vh - 74px);min-height:440px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#02040f}
#wc{position:absolute;inset:0;width:100%;height:100%;max-width:none;border:0;border-radius:0;aspect-ratio:auto;touch-action:none;cursor:pointer}
.hud{position:absolute;top:6px;left:6px;right:6px;pointer-events:none;display:flex;flex-direction:column;gap:5px}
.hrow{display:flex;gap:5px;flex-wrap:wrap}
.hchip{background:rgba(6,10,30,.82);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;white-space:nowrap}
.hchip.strong{border-color:var(--accent);color:#fff}
.hbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;max-width:760px}
.hb{background:rgba(6,10,30,.82);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:.72rem}
.hb .bar{height:7px;margin-top:2px}
.hud .small.good{background:rgba(6,10,30,.82);border-radius:8px;padding:3px 9px;margin:0;align-self:flex-start;max-width:520px}
.panel{position:absolute;left:8px;top:104px;width:min(400px,94%);max-height:calc(100% - 210px);background:rgba(10,16,44,.96);border:2px solid var(--accent);border-radius:14px;z-index:4;display:flex;flex-direction:column;box-shadow:0 10px 40px #000a}
.panel[hidden]{display:none}
.phead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.pbody{overflow:auto;padding:8px 10px}
.pbody .opt{margin:4px 0;padding:6px 10px}
.hotbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:max-content;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96%;z-index:3}
.hotbar button{background:rgba(6,10,30,.9);padding:6px 11px;font-size:.85rem}
.hotbar button.primary{background:var(--accent)}
.dpad{position:absolute;left:10px;bottom:54px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px;z-index:3}
.dpad button{padding:0;touch-action:none;background:rgba(6,10,30,.85)}#dU{grid-column:2}#dL{grid-column:1;grid-row:2}#dD{grid-column:2;grid-row:2}#dR{grid-column:3;grid-row:2}
.actbtns{position:absolute;right:10px;bottom:54px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:3}
@media(max-width:700px){.hbars{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{top:112px;max-height:calc(100% - 240px)}.hotbar button{padding:5px 8px;font-size:.75rem}}

html{background:#070b1f}
:root{--surf:#111a3d;--grid:#2b3a78;--muted2:#9aa8d8;--ref:#c3c2b7;--ink:#eaf0ff;--ink2:#c3c2b7}
header{position:relative}
.hudcard{position:static;z-index:6;background:rgba(7,11,31,.97);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.hudcard .hbars{grid-template-columns:repeat(4,minmax(0,1fr));max-width:none}
.hudcard .hb{background:rgba(26,38,86,.6)}
@media(min-width:900px){.hudcard{position:sticky;top:0}}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modalbg[hidden]{display:none}
.modalbox{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:16px;max-width:580px;max-height:88vh;overflow:auto}
.bq{width:100%;font:inherit;background:#0a1030;color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.bq:focus{outline:none;border-color:var(--accent)}
.matrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;position:relative}
.chartbox h4{margin:0 0 6px;font-weight:400;font-size:.95rem}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;margin:6px 0;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tipbox{position:absolute;z-index:3;background:#0a1030;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.8rem;pointer-events:none;min-width:130px}
.tipbox i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.hbar{display:grid;grid-template-columns:minmax(120px,170px) 1fr minmax(70px,auto);gap:8px;align-items:center;margin:5px 0;font-size:.82rem}
.hbar .ht{height:10px;background:#0a1030;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.hbar .ht i{display:block;height:100%;background:#3987e5;border-radius:0 4px 4px 0}
.hbar .hv{text-align:right;color:var(--ink2)}
details summary{cursor:pointer;margin:6px 0;color:var(--muted)}
.msec{border-bottom:1px solid var(--line);padding:4px 0}
.msec summary{font-size:1rem;color:var(--text)}
.msec table{margin:8px 0}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0}
.cnt{background:rgba(26,38,86,.7);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center}
.cnt .cn{font-size:.75rem;color:var(--muted)}
.cnt .cv{font-size:1.9rem;line-height:1.15;color:#fff}
.cnt .cv span{font-size:.75rem;color:var(--muted);margin-left:4px}
.cnt .cd{font-size:.7rem;color:var(--muted)}
.cnt.warn{border-color:#fbbf24}.cnt.danger{border-color:#f87171}.cnt.danger .cv{color:#fecaca}
.cnt.sp{border-color:var(--accent)}.cnt.sp .cv{color:var(--accent)}
.drama-wrap{min-height:calc(100vh - 80px);justify-content:center;position:relative}
.dramatext{max-width:760px;margin:0 auto;padding:10px;text-align:center;font-family:Audiowide,"Times New Roman",serif}
.dline{font-size:clamp(1.15rem,3.2vw,1.9rem);line-height:1.6;margin:0 0 22px;color:#fff;text-shadow:0 0 18px rgba(96,165,250,.55);min-height:1.6em}
.dline:first-child{font-size:clamp(1.5rem,4.4vw,2.6rem);color:#ffb347;text-shadow:0 0 22px rgba(255,179,71,.6)}
.caret{display:inline-block;width:.55em;height:1em;background:#fff;margin-left:3px;vertical-align:-.12em;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dramabtn{margin-top:10px;text-align:center}
.dskip{position:absolute;top:8px;right:8px}
@media(prefers-reduced-motion:reduce){.caret{animation:none}}
@media(max-width:700px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.livecv{width:100%;max-width:none;display:block;border-radius:8px;margin:6px 0;border:0}
.livedot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;margin-right:6px;animation:lp 1.2s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.livedot{animation:none}}
.msec ul,.msec ol{padding-left:20px;margin:6px 0}
@media(max-width:700px){.hudcard .hbars{grid-template-columns:repeat(2,minmax(0,1fr))}.hbar{grid-template-columns:100px 1fr 60px}}

  if(k==="jup")return `<circle r="${r}" fill="url(#hjup)"/><ellipse cx="6" cy="6" rx="4" ry="2.5" fill="#c4553a"/>${sh}`;
  if(k==="sat")return `<ellipse rx="${r*2}" ry="${r*.55}" fill="none" stroke="#b9a273" stroke-width="5" transform="rotate(-18)"/><circle r="${r}" fill="url(#hsat)"/><ellipse rx="${r*2}" ry="${r*.55}" fill="none" stroke="#e3d2a1" stroke-width="3" transform="rotate(-18)" stroke-dasharray="${r*3.2} ${r*9}" stroke-dashoffset="${-r*3.4}"/>${sh}`;

function planBuild(key,L,buried){

function searchMods(q){
  q=(q||"").toLowerCase().trim();if(!q)return [];
  const toks=q.split(/\s+/);
  const sc=[];for(const k in MODK){const M=MODK[k];if(!modOk(M))continue;const hay=(M.n+" "+CATN[M.cat]+" "+M.note+" "+k+" "+M.d).toLowerCase(),nm=M.n.toLowerCase();let s=0;
    for(const t of toks){if(nm.includes(t))s+=10;if(nm.startsWith(t))s+=4;if(k.startsWith(t))s+=5;if(hay.includes(t))s+=3;else{const w=hay.split(/[^a-z0-9]+/);if(w.some(x=>x.length>3&&t.length>3&&(x.startsWith(t.slice(0,4))||t.startsWith(x.slice(0,4)))))s+=1}}

function applyFx(fx,sev,prot){
  let out=[];
  for(const k in fx){let v=fx[k];
    if(k==="e"){S.penalty+=v;out.push("⏱️ -"+v+"h tomorrow");continue}
    if(k==="armor"){S.armor=Math.min(3,S.armor+v);continue}
    if(k==="dust"){const b=S.dust;S.dust=clamp(S.dust+v);if(v!==0)out.push("🌫️ dust "+(v>0?"+":"")+Math.round(S.dust-b));continue}
    if(k==="delay"){S.orders.forEach(o=>o.arrive+=v);if(S.orders.length)out.push("📦 deliveries delayed "+v+" day");continue}
    if(k==="rad"){const d=Math.round(v*MD().radm*(v>0?shieldF()*siteOf().radf*(1-Math.min(.5,sumFx("warn")))*(sev?W().radEv:1):1)*10)/10;S.rad=Math.max(0,Math.round((S.rad+d)*10)/10);if(d)out.push("☢️ "+(d>0?"+":"")+d+" mSv");continue}
    if(v<0&&sev)v=Math.round(v*sev*(prot?1-.25*armorEff():1)*(1-Math.min(.5,sumFx("prot")+Math.min(.2,sumMat("str")*.0015))));
    S.res[k]=k==="power"?clamp(S.res[k]+v,0,capP()):clamp(S.res[k]+v);
    if(v)out.push(RIC[k]+" "+(v>0?"+":"")+v)}
  clampRes();return out.join("  ")}

  let pool=EV.filter(e=>ok(e)&&!S.seen.includes(e.id));if(!pool.length){S.seen=[];pool=EV.filter(ok)}
  let list=pool;
  if((S.day-S.lastRad>=5||REALSUN.big)&&rnd()<.35){const r=pool.filter(e=>e.type==="rad");if(r.length)list=r}
  else{list=[];pool.forEach(e=>{for(let i=0;i<(e.type==="rad"?2:1);i++)list.push(e)})}
  const e=list[Math.floor(rnd()*list.length)];S.seen.push(e.id);if(e.type==="rad"){S.lastRad=S.day;S.alert=1}return e}

  if(p.left<=0){S.projects.splice(i,1);completeModule(p)}else toast("Progress: "+(p.total-p.left)+"/"+p.total+" hours.");
  save();render()}
function completeModule(p){const M=MODK[p.key];S.modules.push({t:p.key,mat:p.L,buried:!!p.buried});if(p.buried)S.buried++;if(M.fx.armor)S.armor=Math.min(3,S.armor+M.fx.armor);log("🏗️ Built "+M.n+" ("+MAT[p.L].n+")");toast(M.icon+" "+M.n+" is finished! "+M.d)}
function mineReg(){if(S.energy<2){toast("Not enough hours left today.");return}if(!MD().free&&S.res.power<4){toast("Not enough power.");return}S.energy-=2;if(!MD().free)S.res.power=clamp(S.res.power-4);S.res.o2=clamp(S.res.o2-2);const n=6+Math.round(sumFx("m_reg"));S.mat.reg+=n;applyFx({rad:.2},0);log("⛏️ Mined "+n+" regolith bricks");toast("⛏️ +"+n+" regolith bricks");save();render()}
function orderMenu(){openModal(`<b>🚀 Request extra materials</b><p class="small muted">A pack of 6 units costs 6 Science Points and arrives tomorrow.</p>`+Object.keys(MATK).map(k=>`<button class="opt" ${S.sp<6&&!MD().free?"disabled":""} onclick="orderPack('${k}')">${MATK[k][0]} ${MATK[k][1]} <span class="tag">${MD().free?"free":"6 SP"}</span></button>`).join(""),true)}
function orderPack(k){const free=MD().free;if(!free&&S.sp<6)return;if(!free)S.sp-=6;S.orders.push({t:"p:"+k,arrive:S.day+W().ship});log("🚀 Requested "+MATK[k][1]+". Arrives day "+(S.day+W().ship));toast("Requested. A cargo lander will bring 6 "+MATK[k][1]+" on day "+(S.day+W().ship)+".");closeModal();save();render()}
function orderSupply(i){const s=SUP[i],free=MD().free;if(!free&&S.sp<s.cost)return;if(!free)S.sp-=s.cost;S.orders.push({t:"s:"+i,arrive:S.day+W().ship});log("📦 Ordered "+s.n+". Arrives day "+(S.day+W().ship)+".");toast("Ordered. Arrives on day "+(S.day+W().ship)+".");save();render()}
const CARGO={alu:[3,6],steel:[2,5],honey:[2,4],carbon:[2,3],ti:[1,3],reg:[3,6],kap:[2,3],elec:[4,7]};
function cargoDrop(){
  if(W().cargoEvery>1&&(S.day-1)%W().cargoEvery!==0)return "";
  const drops=1+Math.floor(sumFx("cargo")),out=[];
  for(let d=0;d<drops;d++){const keys=Object.keys(CARGO).sort(()=>rnd()-.5).slice(0,3);keys.forEach(k=>{const a=CARGO[k],n=a[0]+Math.floor(rnd()*(a[1]-a[0]+1));S.mat[k]+=n;out.push(MATK[k][0]+n)})}
  if(S.day%3===0){["alu","steel","honey","reg"].forEach(k=>{S.mat[k]+=4;out.push(MATK[k][0]+"4")});["ti","carbon","kap"].forEach(k=>{S.mat[k]+=2;out.push(MATK[k][0]+"2")});S.mat.elec+=4;out.push(MATK.elec[0]+"4")}

const VC={o2:"#3987e5",water:"#d95926",food:"#199e70",power:"#c98500",health:"#d55181",morale:"#0ca30c",rad:"#3987e5",sp:"#3987e5"};
const CREG={};
function recordHist(){S.hist=S.hist.filter(h=>h.d!==S.day);S.hist.push({d:S.day,o2:S.res.o2,water:S.res.water,food:S.res.food,power:S.res.power,health:S.res.health,morale:S.res.morale,rad:Math.round(S.rad*10)/10,sp:S.sp});S.hist=S.hist.slice(-40)}
function lineChart(id,title,series,o){
  o=o||{};const W=600,H=230,L=40,R=92,T=14,B=30,pw=W-L-R,ph=H-T-B,hist=S.hist;
  if(hist.length<2)return `<div class="chartbox"><h4>${esc(title)}</h4><p class="small muted">This chart appears once you have two days of data.</p></div>`;
  const x0=hist[0].d,x1=Math.max(hist[hist.length-1].d,x0+1),ymax=o.max||Math.max(100,...series.flatMap(s=>hist.map(h=>h[s.k]))),X=d=>L+(d-x0)/(x1-x0)*pw,Y=v=>T+ph-(Math.min(v,ymax)/ymax)*ph;
  CREG[id]={W,L,pw,x0,x1,series,hist,X};
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}" class="chart"><rect x="0" y="0" width="${W}" height="${H}" fill="var(--surf)" rx="8"/>`;
  for(let i=0;i<=4;i++){const v=ymax*i/4,y=Y(v);g+=`<line x1="${L}" x2="${L+pw}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted2)">${Math.round(v)}</text>`}
  const step=Math.max(1,Math.ceil((x1-x0)/8));for(let d=x0;d<=x1;d+=step)g+=`<text x="${X(d)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted2)">${d}</text>`;
  g+=`<text x="${L+pw/2}" y="${H-1}" text-anchor="middle" font-size="10" fill="var(--muted2)">Day</text>`;
  (o.refs||[]).forEach(r=>{const y=Y(r.v);g+=`<line x1="${L}" x2="${L+pw}" y1="${y}" y2="${y}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+pw+4}" y="${y+4}" font-size="11" fill="var(--ink2)">${esc(r.label)}</text>`});
  const ends=[];
  series.forEach(s=>{const pts=hist.map(h=>[X(h.d),Y(h[s.k])]);g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;const e=pts[pts.length-1];g+=`<circle cx="${e[0]}" cy="${e[1]}" r="4" fill="${s.c}" stroke="var(--surf)" stroke-width="2"/>`;ends.push({y:e[1],s})});
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;
  if(!o.refs||series.length<=4)ends.forEach(e=>{g+=`<text x="${L+pw+8}" y="${e.y+4}" font-size="11.5" fill="var(--ink)">${esc(e.s.n)}</text>`});
  g+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/><rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent" onmousemove="chHover(event,'${id}')" ontouchmove="chHover(event.touches[0],'${id}')" onmouseleave="chOut('${id}')"/></svg>`;
  const legend=`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>`;
  const table=`<details><summary class="small">Show as a table</summary><div style="overflow:auto"><table><tr><th>Day</th>${series.map(s=>`<th>${esc(s.n)}</th>`).join("")}</tr>${hist.map(h=>`<tr><td>${h.d}</td>${series.map(s=>`<td>${Math.round(h[s.k]*10)/10}</td>`).join("")}</tr>`).join("")}</table></div></details>`;
  return `<div class="chartbox" id="cb_${id}"><h4>${esc(title)}</h4>${g}<div class="tipbox" id="tip_${id}" hidden></div>${legend}${table}</div>`}
function chHover(e,id){
  const c=CREG[id],box=document.getElementById("cb_"+id);if(!c||!box)return;const svg=box.querySelector("svg"),r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*c.W;
  let best=c.hist[0],bd=1e9;c.hist.forEach(h=>{const d=Math.abs(c.X(h.d)-px);if(d<bd){bd=d;best=h}});
  const xh=svg.querySelector(".xh");xh.setAttribute("x1",c.X(best.d));xh.setAttribute("x2",c.X(best.d));xh.setAttribute("visibility","visible");
  const tb=document.getElementById("tip_"+id);tb.hidden=false;tb.innerHTML=`<b>Day ${best.d}</b>`+c.series.map(s=>`<div><i style="background:${s.c}"></i>${esc(s.n)}: <b>${Math.round(best[s.k]*10)/10}</b></div>`).join("");
  const left=Math.min(r.width-150,Math.max(0,c.X(best.d)/c.W*r.width+10));tb.style.left=left+"px";tb.style.top="40px"}
function chOut(id){const box=document.getElementById("cb_"+id);if(!box)return;const x=box.querySelector(".xh");if(x)x.setAttribute("visibility","hidden");const t=document.getElementById("tip_"+id);if(t)t.hidden=true}
function barChart(title,items,o){
  o=o||{};const mx=o.max||Math.max(1,...items.map(i=>i.v));
  return `<div class="chartbox"><h4>${esc(title)}</h4>${items.map(i=>`<div class="hbar" title="${esc(i.l)}: ${i.t||i.v}"><span class="hl">${esc(i.l)}</span><span class="ht"><i style="width:${Math.max(0,Math.min(100,i.v/mx*100))}%"></i></span><span class="hv">${esc(i.t||String(i.v))}</span></div>`).join("")}<details><summary class="small">Show as a table</summary><table>${items.map(i=>`<tr><td>${esc(i.l)}</td><td>${esc(i.t||String(i.v))}</td></tr>`).join("")}</table></details></div>`}

  barChart("Materials in stock (units)",Object.keys(MATK).map(k=>({l:MATK[k][0]+" "+MATK[k][1],v:MD().free?99:S.mat[k],t:MD().free?"∞":String(S.mat[k])})),{max:Math.max(12,...Object.values(S.mat))})+
  barChart("Power budget today",[{l:"☀️ Solar panels",v:gen,t:"+"+gen},{l:"🏗️ Modules",v:modP,t:(modP>=0?"+":"")+modP},{l:"🏠 Base use (day)",v:Math.round(DAY.use*dr),t:"−"+Math.round(DAY.use*dr)},{l:"🔥 Heaters tonight",v:nightPower(),t:"−"+nightPower()}],{max:Math.max(60,gen+modP)})+
  barChart("Modules built by type",Object.keys(CATN).map(c=>({l:CATN[c],v:cats[CATN[c]]||0,t:String(cats[CATN[c]]||0)})),{max:Math.max(3,...Object.values(cats),0)})+

let MBACK="home";

function renderManual(){
  const sec=(t,b,open)=>`<details class="msec" ${open?"open":""}><summary><b>${t}</b></summary><div class="small">${b}</div></details>`;
  const matRows=Object.keys(MAT).map(l=>{const m=MAT[l];return `<tr><td>${m.icon} ${m.n}</td><td>×${m.units}</td><td>×${m.time}</td><td>×${m.power}</td><td>${m.str}</td><td>${m.shield}</td><td>${m.therm}</td></tr>`}).join("");
  const modeRows=Object.keys(MODES).map(k=>{const m=MODES[k];return `<tr><td>${m.icon} ${m.n}</td><td>${m.en}h</td><td>${Math.round(m.prob*100)}%</td><td>×${m.dr}</td><td>×${m.radm}</td><td>${m.samp}</td></tr>`}).join("");
  return `<div class="card"><div class="row spread"><h2>📖 How to play: full manual</h2><button onclick="closeManual()">← Back</button></div><p class="muted small">Everything you need to survive. Tap a section to open it. This manual is about the game. Astronaut training (real NASA training) is a separate course.</p>
  ${sec("0. Moon and Mars",`<p>You chose <b>${W().n}</b>. The two worlds play differently.</p><ul><li><b>Moon:</b> full sunlight but 15 dark days, radiation about 1.4 mSv/day, radio delay 1.3 seconds, cargo every day.</li><li><b>Mars:</b> sunlight only 45% as strong, two dust storms, radiation about 0.67 mSv/day, radio delay 4 to 24 minutes (calls home help half as much), cargo every other day and orders take 3 days. The air is full of carbon dioxide you can turn into oxygen, but the soil has toxic perchlorates.</li></ul>`,true)}
  ${sec("1. Your mission",`<p>Survive <b>${NIGHTS} days</b> at Outpost 7, the seventh outpost on ${W().n}. Six crews before you were lost. To <b>win</b> you must survive all ${NIGHTS} days, collect the required number of rock samples (4 to 6 by mode, 1 in Free Play) and load them into the return capsule.</p><p>You <b>lose</b> if oxygen reaches 0, health reaches 0 or your radiation dose reaches ${RADMAX} mSv. (Free Play cannot be lost.)</p>`,true)}
  ${sec("2. How a day works",`<p>Each morning you have a number of <b>hours</b> (11 to 18 by mode). Almost everything uses hours: <b>Maintain</b> jobs, <b>Science</b> tasks, <b>Explore</b> trips, <b>Build</b> work and <b>Mission</b> tasks. Hours do not carry over.</p><p>Often a <b>major problem</b> strikes in the morning (a choice with trade-offs). When you press <b>End the day</b>, the day's supplies are used, daily module effects happen, and a <b>night event</b> strikes. Then you read the night report and start the next day. Trips outside can also cause an <b>EVA incident</b>.</p>`)}
  ${sec("3. The seven meters",`<p>🫧 <b>Oxygen</b>, 💧 <b>water</b>, 🍲 <b>food</b>, ⚡ <b>power</b>, ❤️ <b>health</b>, 🙂 <b>morale</b> and ☢️ <b>radiation</b>. Each full day uses oxygen, water and food. Power is made by panels and modules and used by the base and heaters.</p><ul><li>Oxygen at 0 ends the mission.</li><li>No water: health −25 each night. No food: health −15.</li><li>Power below 0 at night: the heaters stop and health −30.</li><li>Morale at 0: health −10. Morale below 25: 2 fewer hours the next day.</li></ul><p>Fix them with the <b>Maintain</b> tab (scrubbers, recycling, meals, exercise, calls home) and with modules.</p>`)}
  ${S.world==="mars"?sec("4. Sols, dust storms and power",`<p>A Mars day (a sol) lasts about 24 hours 37 minutes. Sunlight at Mars is only about 43% as strong as at Earth, so solar panels make less than half the power they would on the Moon. Two <b>dust storms</b> (3 to 6 sols each) block almost all of the Sun, and dust covers panels faster (+22% a day, so brush them). Nights are cold (about −100 °C) and your heaters use power every night. Build power that does not depend on sunlight, such as a <b>Kilopower reactor</b>, batteries and fuel cells. Power storage is capped at 100 (more with fuel cells and batteries).</p>`):sec("4. Lunar days and nights, and power",`<p>A real lunar day lasts about 29.5 Earth days (NASA). In this game <b>days 1 to 15 are sunlit</b> and <b>days 16 to ${NIGHTS} are dark</b>. Solar panels make power only when it is sunlit, and dust covers them (+18% a day, so brush them). During the dark days outside is about −173 °C and you need power that does not depend on sunlight, such as a <b>Kilopower reactor</b>, batteries and fuel cells. Power storage is capped at 100 (more with fuel cells and batteries).</p>`)}
  ${sec("5. Radiation",`<p>${S.world==="mars"?"Mars has a thin atmosphere but no global magnetic field. NASA's Curiosity rover measured about <b>0.67 mSv a day</b> on the surface, about half the Moon's dose.":"The Moon has no atmosphere or magnetic field, so radiation reaches the surface. You get about <b>1.4 mSv a day</b> (NASA-era surface measurements)."} Your dose is multiplied by the mode setting and reduced by your shielding. Trips outside add a bit more. <b>Solar particle events</b> can add 45 to 110 mSv if you ignore them. <b>Cosmic ray surges</b> add a smaller dose.</p><p>At <b>120 mSv</b> you get radiation sickness (health loss each night). At <b>${RADMAX} mSv</b> the mission ends. (NASA's career limit for astronauts is 600 mSv.)</p><p>Reduce the dose with <b>shielding</b>: radiation shelters, water walls, regolith berms and burying modules under regolith (+0.5 shield each). Thick materials help too: regolith bricks (shield 4) and steel (shield 3) beat carbon fiber (0). Flare alarms and radiation monitors warn you early and cut the dose of storm events.</p>`)}
  ${sec("6. Materials and building",`<ol><li>Open the <b>Build</b> tab and <b>type what you want to build</b> (for example “greenhouse”, “oxygen” or “dust”). There are ${modCount()} modules. You can also pick a category.</li><li>Choose a <b>structure material</b>. Materials change the build <b>time</b>, <b>power</b> and number of <b>units</b> needed, and give your base <b>strength</b>, <b>shield</b> and <b>insulation</b>.</li><li>Press <b>Start building</b>. The materials are set aside right away.</li><li>Spend hours on the project in the same tab. <b>Each hour costs power.</b> When the last hour is done, the module is finished.</li></ol><p>Some modules have a <b>set material and set time</b> (for example the Kilopower reactor needs titanium and 8 hours, and radiation shelters need regolith). Those cannot be changed.</p><table><tr><th>Material</th><th>Units</th><th>Time</th><th>Power</th><th>Strength</th><th>Shield</th><th>Insulation</th></tr>${matRows}</table><p>Strength lowers event damage (up to −20%). Insulation lowers heater use (up to −30%). Shield lowers radiation.</p><p><b>Cargo landers</b> bring new materials <b>${W().cargoEvery===1?"every day":"every other day"}</b>, with a big load every 3rd day. Material and supply orders take ${W().ship} day${W().ship>1?"s":""}. You can also <b>mine regolith</b> yourself, request extra material packs for 6 Science Points, and build mining and manufacturing modules that make materials every day.</p>`)}
  ${sec("7. Exploring and rock samples",`<p>The <b>Explore</b> tab lists places to go. A trip costs <b>hours</b> (round trip plus the task), <b>suit oxygen</b> and a small <b>radiation dose</b>, and there is a chance of an <b>EVA incident</b>. A ${S.world==="mars"?"Mars rover":"Lunar Terrain Vehicle"} garage halves the costs.</p><p>There are 8 rock types (regolith, anorthosite, mare basalt, titanium basalt, breccia, orange volcanic glass, KREEP rock and polar ice). Each comes from a different place and teaches a real NASA fact. Back at base, <b>load samples into the return capsule</b> in the Mission tab. You can also search the wrecks of Outposts 1 to 6 to read their last logs, and explore a lava tube.</p>`)}
  ${sec("8. Events and choices",`<p>Every event is a choice and <b>every option costs something</b>. Events come in types: ☢️ radiation, 🔧 technical, 🩺 medical, 🌑 environment, 📦 supply and 🧠 crew. After you choose, you learn the real NASA mission or fact behind it. Modules and shielding make events hurt less.</p>`)}
  ${sec("9. Science Points",`<p>Earn Science Points (SP) from science tasks, samples, wrecks, quizzes and Mission Control's +5 SP grant every day. Spend them on supplies and extra material packs. Some modules also make SP every day.</p>`)}
  ${sec("10. Reading the data charts",`<p>The <b>Data</b> tab shows how much of everything you have: bars for meters, materials, power budget and modules, and line charts for oxygen, water, food, power, health, morale, radiation and Science Points over the days. Hover or tap a chart to read exact values. Every chart has a table view.</p><p>Watch the <b>radiation chart</b> against the dashed lines for sickness (120 mSv) and the limit (${RADMAX} mSv), and the <b>power budget</b> before the dark days begin.</p>`)}
  ${sec("11. Game modes",`<table><tr><th>Mode</th><th>Hours/day</th><th>Morning problem chance</th><th>Supply drain</th><th>Radiation</th><th>Samples needed</th></tr>${modeRows}</table>`)}
  ${sec("12. A good first three days",`<ol><li>Day 1: fix any low meter, brush the solar panels, then <b>build something small</b> that makes power or air.</li><li>Day 2: explore the nearby field site for your first sample, and read the Base tab.</li><li>Day 3: build a <b>radiation shelter</b> (regolith). Check the Data tab. Keep 2 to 3 hours free for problems.</li><li>Before day 16: build a <b>Kilopower reactor</b> and batteries for the dark days.</li></ol>`)}
  </div>`}

const LCH=[

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

  <div class="chartbox"><h4>🛰️ NASA DONKI: space weather this week</h4><div id="donki" class="small muted">Contacting NASA DONKI…</div><div id="apod"></div></div>`}
function startLive(){
  stopLive();const cv=$("#livecv");if(!cv)return;

function stopLive(){if(LIVE){clearInterval(LIVE.timer);clearInterval(LIVE.noaaT);LIVE=null}}
function liveToggle(){if(!LIVE)return;LIVE.paused=!LIVE.paused;const b=$("#livebtn");if(b)b.textContent=LIVE.paused?"▶ Resume":"⏸ Pause"}
function liveStep(){
  LCH.forEach((d,i)=>{const tgt=d.t();let v=LIVE.v[i];v+=(tgt-v)*.18+gauss()*d.sd(tgt);if(Math.random()<.015)LIVE.spike[i]=(Math.random()<.5?-1:1)*d.sd(tgt)*(4+Math.random()*4);v+=LIVE.spike[i];LIVE.spike[i]*=.55;LIVE.v[i]=v;const h=LIVE.hist[i];h.push(v);if(h.length>LIVE.n)h.shift()})}
function liveDraw(){
  const cv=$("#livecv");if(!cv||!LIVE)return;const c=cv.getContext("2d"),{W,H,dpr}=LIVE;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  c.fillStyle="#111a3d";c.fillRect(0,0,W,H);
  const lx=150,rx=W-76,row=58;
  LCH.forEach((d,i)=>{const y0=i*row+3,h=row-6,hist=LIVE.hist[i],tgt=d.t(),span=d.span(tgt),lo=tgt-span,hi=tgt+span;
    c.strokeStyle="#2b3a78";c.lineWidth=1;c.beginPath();c.moveTo(lx,y0+h/2);c.lineTo(rx,y0+h/2);c.stroke();c.beginPath();c.moveTo(lx,y0+h);c.lineTo(rx,y0+h);c.stroke();
    c.beginPath();hist.forEach((v,k)=>{const x=lx+(k/(LIVE.n-1))*(rx-lx),y=y0+h-((Math.min(hi,Math.max(lo,v))-lo)/(hi-lo))*h;k?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle=LCOL[i];c.lineWidth=2;c.lineJoin="round";c.stroke();
    const last=hist[hist.length-1],ey=y0+h-((Math.min(hi,Math.max(lo,last))-lo)/(hi-lo))*h;c.fillStyle=LCOL[i];c.beginPath();c.arc(rx,ey,4,0,6.3);c.fill();c.strokeStyle="#111a3d";c.lineWidth=2;c.stroke();
    c.fillStyle="#eaf0ff";c.font="12px Audiowide,sans-serif";c.textBaseline="middle";c.textAlign="left";c.fillText(d.n,8,y0+h/2-8);c.fillStyle="#9aa8d8";c.font="11px Audiowide,sans-serif";c.fillText(d.u,8,y0+h/2+9);
    c.fillStyle="#eaf0ff";c.font="13px Audiowide,sans-serif";c.textAlign="left";c.fillText(last.toFixed(d.dec),rx+10,ey)});

/* ---- real NOAA data (works when the page can reach the network) ---- */
function flareClass(f){if(f>=1e-4)return "X"+(f/1e-4).toFixed(1);if(f>=1e-5)return "M"+(f/1e-5).toFixed(1);if(f>=1e-6)return "C"+(f/1e-6).toFixed(1);if(f>=1e-7)return "B"+(f/1e-7).toFixed(1);return "A"+Math.max(0.1,f/1e-8).toFixed(1)}
async function getJSON(url){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);try{const r=await fetch(url,{signal:ac.signal,cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
async function loadNoaa(){
  const box=$("#noaa");if(!box)return;
  try{
    const xr=await getJSON("https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json");
    const pts=xr.filter(p=>(p.energy||"").indexOf("0.1-0.8")>=0&&(p.flux||p.observed_flux)>0).map(p=>({t:new Date(p.time_tag).getTime(),f:Number(p.flux||p.observed_flux)}));
    if(!pts.length)throw new Error("no X-ray data");
    const last=pts[pts.length-1];REALSUN.ok=true;REALSUN.cls=flareClass(last.f);REALSUN.big=pts.slice(-72).some(p=>p.f>=1e-5);
    let kpTxt="";try{const kp=await getJSON("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json");const rows=kp.slice(1).filter(r=>r.length>=2);const lastK=rows[rows.length-1];REALSUN.kp=parseFloat(lastK[1]);kpTxt=` · Planetary Kp index <b>${REALSUN.kp}</b> (${REALSUN.kp>=5?"geomagnetic storm":REALSUN.kp>=4?"active":"quiet"})`}catch(_){}
    box.innerHTML=`<span class="livedot"></span> <b>LIVE</b> from NOAA (GOES satellite). Solar X-ray flux right now: <b>class ${REALSUN.cls}</b>${REALSUN.big?" · ⚠️ a medium or large flare happened in the last 6 hours":""}${kpTxt}. Updated ${new Date(last.t).toUTCString().slice(17,22)} UTC. The solid line is the real Sun over the last 6 hours.`;
    drawNoaa(pts)}
  catch(err){
    REALSUN.ok=false;box.innerHTML=`📡 The live NOAA feed is not available in this window (${esc(String(err.message||err)).slice(0,60)}). Some hosted previews block outside network access. Open the game file directly in a browser to see the real Sun live. The simulated telemetry above still runs.`;const cv=$("#noaacv");if(cv)cv.style.display="none"}}
function drawNoaa(pts){
  const cv=$("#noaacv");if(!cv)return;cv.style.display="block";const dpr=Math.min(2,window.devicePixelRatio||1),W=Math.max(300,cv.clientWidth||600),H=190;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle="#111a3d";c.fillRect(0,0,W,H);
  const L=46,R=40,T=10,B=22,pw=W-L-R,ph=H-T-B,t0=pts[0].t,t1=pts[pts.length-1].t,lmin=-8,lmax=-3,Y=f=>T+ph-((Math.log10(Math.max(1e-9,f))-lmin)/(lmax-lmin))*ph,X=t=>L+(t-t0)/(t1-t0||1)*pw;
  [["A",-8],["B",-7],["C",-6],["M",-5],["X",-4]].forEach(([n,e])=>{const y=Y(Math.pow(10,e));c.strokeStyle="#2b3a78";c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();c.fillStyle="#9aa8d8";c.font="11px Audiowide,sans-serif";c.textAlign="right";c.textBaseline="middle";c.fillText(n,L-8,y)});
  c.beginPath();pts.forEach((p,i)=>{const x=X(p.t),y=Y(p.f);i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle="#c98500";c.lineWidth=2;c.lineJoin="round";c.stroke();
  const lp=pts[pts.length-1];c.fillStyle="#c98500";c.beginPath();c.arc(X(lp.t),Y(lp.f),4,0,6.3);c.fill();c.strokeStyle="#111a3d";c.lineWidth=2;c.stroke();
  c.fillStyle="#eaf0ff";c.font="12px Audiowide,sans-serif";c.textAlign="left";c.fillText(flareClass(lp.f),X(lp.t)-pw*.12,Math.max(T+8,Y(lp.f)-12));
  c.fillStyle="#9aa8d8";c.font="10px Audiowide,sans-serif";c.textAlign="center";c.fillText("6 hours ago",L+30,H-6);c.fillText("now",L+pw-10,H-6);c.save();c.translate(10,T+ph/2);c.rotate(-Math.PI/2);c.fillText("X-ray flux (W/m²)",0,0);c.restore()}

const DONKI={ok:false,t:0,d:null,busy:false};
const NKEY="DEMO_KEY",NBASE="https://api.nasa.gov/";
function ymd(d){return d.toISOString().slice(0,10)}
async function loadDonki(force){
  const box=$("#donki");if(!box)return;
  if(DONKI.d&&!force&&Date.now()-DONKI.t<600000){drawDonki();return}
  if(DONKI.busy)return;DONKI.busy=true;
  const end=new Date(),st=new Date(end.getTime()-7*864e5),q=`?startDate=${ymd(st)}&endDate=${ymd(end)}&api_key=${NKEY}`;
  try{
    const g=async k=>{try{const r=await getJSON(NBASE+"DONKI/"+k+q);return Array.isArray(r)?r:[]}catch(e){if(k==="FLR")throw e;return null}};
    const [flr,cme,gst,sep,rbe]=await Promise.all(["FLR","CME","GST","SEP","RBE"].map(g));
    DONKI.d={flr,cme,gst,sep,rbe,st:st.getTime(),en:end.getTime()};DONKI.ok=true;DONKI.t=Date.now();
    const rec=(DONKI.d.flr||[]).some(f=>/^[MX]/.test(f.classType||"")&&end-new Date(f.peakTime||f.beginTime)<2*864e5);
    REALSUN.donki=rec||(sep||[]).length>0||(rbe||[]).length>0;if(REALSUN.donki)REALSUN.big=true;
    drawDonki();loadApod()}
  catch(err){DONKI.ok=false;box.innerHTML=`📡 NASA DONKI is not reachable in this window (${esc(String(err.message||err)).slice(0,60)}). Some hosted previews block outside network access. Open the game file directly in a browser to see the real space-weather events of the last 7 days. See them online at <a style="color:var(--blue)" href="https://ccmc.gsfc.nasa.gov/DONKI/" target="_blank" rel="noopener">ccmc.gsfc.nasa.gov/DONKI</a>.`}
  finally{DONKI.busy=false}}
function dkTime(s){const d=new Date(s);return isNaN(d)?"?":d.toUTCString().slice(5,22)+" UTC"}
function drawDonki(){
  const box=$("#donki"),D=DONKI.d;if(!box||!D)return;
  const T=(a,b)=>a===null?"n/a":a.length,W=720,H=170,x0=76,x1=W-14,sx=t=>x0+(x1-x0)*(t-D.st)/(D.en-D.st),rows=[["Flares","flr","#d95926",f=>f.peakTime||f.beginTime],["CMEs","cme","#3987e5",f=>f.startTime],["Storms (Kp)","gst","#c98500",f=>f.startTime],["Protons","sep","#d55181",f=>f.eventTime],["Belt","rbe","#199e70",f=>f.eventTime]];
  let o=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Space weather events of the last 7 days from NASA DONKI"><rect width="${W}" height="${H}" fill="var(--surf)" rx="8"/>`;
  for(let d=0;d<=7;d++){const x=x0+(x1-x0)*d/7;o+=`<line x1="${x}" y1="14" x2="${x}" y2="${H-24}" stroke="#2b3a78" stroke-opacity=".6"/><text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d===7?"now":"-"+(7-d)+"d"}</text>`}
  rows.forEach((r,i)=>{const y=28+i*26;o+=`<text x="${x0-4}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${r[0]}</text><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#2b3a78" stroke-dasharray="2 4"/>`;
    (D[r[1]]||[]).forEach(e=>{const t=new Date(r[3](e)).getTime();if(!(t>=D.st&&t<=D.en))return;const big=r[1]==="flr"&&/^[MX]/.test(e.classType||"");o+=`<circle cx="${sx(t)}" cy="${y}" r="${big?7:5}" fill="${r[2]}" stroke="#fff" stroke-opacity=".6"><title>${r[0]}: ${esc(r[1]==="flr"?(e.classType||"")+" flare, "+dkTime(r[3](e)):dkTime(r[3](e)))}</title></circle>`})});
  o+="</svg>";
  const nf=T(D.flr),big=(D.flr||[]).filter(f=>/^[MX]/.test(f.classType||"")),fastest=(D.cme||[]).map(c=>{const a=(c.cmeAnalyses||[]).find(x=>x.isMostAccurate)||(c.cmeAnalyses||[])[0];return a&&a.speed?a.speed:0}).reduce((a,b)=>Math.max(a,b),0);
  const maxKp=(D.gst||[]).reduce((m,g)=>Math.max(m,...(g.allKpIndex||[]).map(k=>k.kpIndex||0)),0);
  const rb=D.rbe;
  const tile=(n,l,c)=>`<div class="card" style="flex:1;min-width:120px;text-align:center;border-top:3px solid ${c}"><div style="font-size:24px;font-weight:700">${n}</div><div class="small muted">${l}</div></div>`;
  const latest=(D.flr||[]).slice(-3).reverse().map(f=>`<li>☀️ <b>${esc(f.classType||"flare")}</b> flare, peak ${dkTime(f.peakTime||f.beginTime)}${f.sourceLocation?" at "+esc(f.sourceLocation):""}</li>`).join("");
  box.innerHTML=`<p class="small"><span class="livedot"></span> <b>LIVE</b> from NASA DONKI (Space Weather Database Of Notifications, Knowledge, Information) for the last 7 days. Each dot is a real event.</p>
  <div class="row" style="gap:8px;flex-wrap:wrap">${tile(nf,"solar flares","#d95926")}${tile(big.length,"M or X flares","#d95926")}${tile(T(D.cme),"CMEs"+(fastest?" · fastest "+Math.round(fastest)+" km/s":""),"#3987e5")}${tile(T(D.gst),"geomagnetic storms"+(maxKp?" · Kp "+maxKp:""),"#c98500")}${tile(T(D.sep),"proton events","#d55181")}${tile(T(rb),"radiation belt events","#199e70")}</div>${o}
  <h5 style="margin:10px 0 4px">🛰️ Radiation belt (Van Allen belts)</h5>
  <p class="small">${rb===null?"Radiation belt data was not returned this time.":rb.length?`DONKI logged <b>${rb.length} radiation belt enhancement${rb.length>1?"s":""}</b> this week (most recent ${dkTime(rb[rb.length-1].eventTime)}). During an enhancement, energetic electrons in the belts surge, which can damage satellites and add to a crew's dose when they pass through.`:`No radiation belt enhancement was logged this week. The Van Allen belts are two rings of trapped charged particles around Earth, and a solar storm can make them surge.`}</p>
  <h5 style="margin:10px 0 4px">Latest flares</h5><ul class="small">${latest||"<li>No flares were logged this week.</li>"}</ul>
  <p class="small muted">${REALSUN.donki?"⚠️ Real activity this week makes radiation events a little more likely in your game.":"A quiet Sun this week. Your game's radiation events use the normal chance."}</p>`}
async function loadApod(){
  const box=$("#apod");if(!box||box.dataset.ok)return;
  try{const a=await getJSON(NBASE+"planetary/apod?api_key="+NKEY);if(!a||!a.title)throw new Error("none");box.dataset.ok="1";
    box.innerHTML=`<h5 style="margin:6px 0">🌌 NASA picture of the day: ${esc(a.title)}</h5>${a.media_type==="image"?`<img src="${esc(a.url)}" alt="${esc(a.title)}" style="max-width:100%;border-radius:8px;max-height:260px;object-fit:cover">`:`<p class="small"><a href="${esc(a.url)}" target="_blank" rel="noopener">Open today's video</a></p>`}<p class="small muted">${esc((a.explanation||"").slice(0,260))}${(a.explanation||"").length>260?"…":""} (${esc(a.date||"")}, NASA Astronomy Picture of the Day)</p>`}
  catch(_){box.innerHTML=""}}

/* ============ ASTRONAUT TRAINING ACADEMY (real training) ============ */
const trainTimelineSVG=()=>`<svg viewBox="0 0 600 96" class="chart" role="img" aria-label="Astronaut career timeline: selection, about two years of candidate training, mission assignment, mission training, flight"><rect width="600" height="96" fill="var(--surf)" rx="8"/><g font-size="11" fill="#10131f"><rect x="14" y="16" width="86" height="26" fill="#d55181" rx="3"/><text x="57" y="33" text-anchor="middle">Selection</text><rect x="104" y="16" width="170" height="26" fill="#3987e5" rx="3"/><text x="189" y="33" text-anchor="middle">Candidate training (about 2 years)</text><rect x="278" y="16" width="100" height="26" fill="#c98500" rx="3"/><text x="328" y="33" text-anchor="middle">Assignment</text><rect x="382" y="16" width="130" height="26" fill="#199e70" rx="3"/><text x="447" y="33" text-anchor="middle">Mission training</text><rect x="516" y="16" width="72" height="26" fill="#d95926" rx="3"/><text x="552" y="33" text-anchor="middle">Flight</text></g><text x="14" y="70" font-size="11" fill="var(--muted2)">In 2021 NASA chose 10 candidates from more than 12,000 applicants.</text></svg>`;
const LESSONS=[
 {t:"Becoming an astronaut",icon:"🎓",body:()=>`<p>NASA chooses astronaut candidates from thousands of applicants. In 2021 it picked <b>10 new candidates from more than 12,000 applications</b>. Applicants need at least a <b>master's degree in a science, technology, engineering or math field</b> (or an equivalent, such as completing test pilot school), plus <b>three years of professional experience</b> or <b>1,000 hours as a jet pilot in command</b>. They must also pass a long-duration spaceflight medical exam.</p><p>After selection, astronaut candidates train for about <b>two years</b> before they can be assigned to a flight. Then they train for their specific mission, and training never really stops.</p>${trainTimelineSVG()}`,fact:"The word “astronaut” comes from Greek words meaning “star sailor”.",q:"About how long does basic astronaut candidate training last?",o:["About two years","About two weeks","About ten years","One afternoon"],c:0,why:"Candidates spend roughly two years learning the basics of spaceflight before they are assigned to a mission."},
 {t:"Spacewalk training underwater",icon:"🏊",body:()=>`<p>Astronauts rehearse spacewalks in NASA's <b>Neutral Buoyancy Laboratory</b> at Johnson Space Center in Houston, a pool holding about <b>6.2 million gallons</b> of water with full-size mock-ups of space station modules.</p><p>Divers add weights and floats until the astronaut in the spacesuit <b>neither sinks nor floats</b>. That <b>neutral buoyancy</b> feels a lot like weightlessness. Teams often train about <b>seven hours in the pool for every hour</b> of planned spacewalk, so that every move is practised.</p><p>The spacesuit is pressurized to only about a third of normal air pressure, so astronauts breathe pure oxygen and <b>pre-breathe</b> before going outside to avoid decompression sickness, like divers who surface too fast.</p>`,fact:"A typical spacewalk lasts about six to seven hours.",q:"Why do astronauts practise spacewalks underwater?",o:["Neutral buoyancy feels like weightlessness","Space is full of water","Pools are cheaper than suits","It keeps the suit cool"],c:0,why:"In water, weights and floats balance the astronaut so they feel almost weightless, the closest practice on Earth."},
 {t:"Flying and surviving",icon:"✈️",body:()=>`<p>Many astronauts fly NASA's <b>T-38 jets</b>. Flying a fast jet trains <b>quick decisions, teamwork and clear communication under pressure</b>, skills a crew needs when something goes wrong.</p><p>Astronauts also take <b>survival training</b>. A returning capsule can land far from its target, in an ocean, a desert or a snowy forest. Crews practise <b>water survival</b> (escaping a floating capsule and using life rafts) and wilderness survival, and learn how to stay safe, signal for help and work together until rescuers arrive.</p>`,fact:"Soyuz crews practise survival in winter forests and at sea in case their capsule lands off course.",q:"Why do astronauts train in jets and practise survival skills?",o:["To make fast decisions under pressure and to survive if a landing goes wrong","To win races","Because rockets use jet fuel","To get a pilot's licence for fun"],c:0,why:"Both build calm decision making, teamwork and the skills to survive if a landing does not go to plan."},
 {t:"Weightlessness and g-forces",icon:"🎢",body:()=>`<p>NASA's <b>reduced-gravity aircraft</b> fly up and down in arcs called parabolas. Each arc gives about <b>20 to 25 seconds of weightlessness</b>, long enough to practise moving and working. It earned the nickname “Vomit Comet” because many people feel sick.</p><p>A <b>centrifuge</b> spins astronauts to feel the heavy forces of launch and re-entry, roughly <b>3 to 4 times their normal weight</b> (3 to 4 g).</p><p>In orbit, body fluids shift toward the head, faces look puffy and many astronauts get <b>space motion sickness</b> for the first few days. Bones and muscles start to weaken, which is why exercise matters.</p>`,fact:"Astronauts can grow taller in space by a few centimetres because the spine is no longer compressed.",q:"About how much weightlessness does one parabola of a reduced-gravity flight give?",o:["About 20 to 25 seconds","About 20 minutes","About 2 hours","None at all"],c:0,why:"Each arc gives a short burst of weightlessness, so the aircraft flies dozens of parabolas in a session."},
 {t:"Staying healthy in space",icon:"🏋️",body:()=>`<p>Without gravity, the body does less work. Astronauts can lose about <b>1% of bone density every month</b> in orbit unless they fight it. On the ISS, crews <b>exercise about two hours a day</b> on a treadmill, a bike and a resistance machine called <b>ARED</b>.</p><p>Doctors on the ground (<b>flight surgeons</b>) watch each astronaut's health, sleep and mood. NASA's <b>Twins Study</b> compared astronaut Scott Kelly, who spent nearly a year on the ISS, with his identical twin Mark on Earth, to see how long spaceflight changes the body.</p><p>Food, sleep and time to relax are scheduled on purpose, because a tired or lonely crew makes mistakes.</p>`,fact:"Astronauts' vision can change on long flights, and NASA studies why.",q:"Why do ISS astronauts exercise about two hours every day?",o:["To protect their bones and muscles","To burn off rocket fuel","Because it is a rule from Russia only","To stay awake all night"],c:0,why:"Weightlessness weakens bones and muscles, and daily exercise is the main defence."},
 {t:"Radiation",icon:"☢️",body:()=>`<p>Space is full of radiation. <b>Galactic cosmic rays</b> come from far outside the solar system, and <b>solar particle events</b> burst from the Sun during flares. On Earth, the atmosphere and magnetic field protect us. In orbit, and especially on the Moon, there is much less protection.</p><p>Astronauts wear <b>dosimeters</b> that measure their exposure, and NASA sets limits. In 2022 NASA adopted a <b>600 mSv career limit</b> for all astronauts. For comparison, people on Earth get about 3 mSv a year from natural background radiation, and ISS crews get roughly 50 to 100 mSv over six months.</p><p>During a solar storm, crews <b>move to the best-shielded area</b>. The Orion spacecraft is designed so the crew can build a small storm shelter from stowed supplies.</p>`,fact:"Water, regolith and dense supplies make good radiation shields.",q:"What should a crew do during a solar particle event?",o:["Move to the best-shielded area","Go outside to look","Turn off all the lights","Ignore it"],c:0,why:"Shelter in the best-shielded place and wait. Dose depends on how much shielding is between you and the storm."},
 {t:"Life support systems",icon:"🫧",body:()=>`<p>On the ISS everything is recycled. The <b>Oxygen Generation Assembly</b> splits water into oxygen and hydrogen with electricity. The <b>Carbon Dioxide Removal Assembly</b> pulls the CO₂ out of the air. A <b>Sabatier reactor</b> combines CO₂ with hydrogen to make water. The <b>Water Recovery System</b> recycles about <b>98%</b> of water, including sweat, breath moisture and urine.</p><p>An astronaut needs about <b>0.84 kg of oxygen every day</b>, plus water and food. Because resupply is slow and expensive, astronauts are trained to watch and repair these systems, even fixing the toilet and water recycler.</p>`,fact:"The ISS has hosted astronauts continuously since November 2000.",q:"Which ISS system makes oxygen by splitting water?",o:["The Oxygen Generation Assembly","The Sabatier reactor","The treadmill","The airlock"],c:0,why:"The Oxygen Generation Assembly uses electricity to split water into oxygen and hydrogen."},
 {t:"Emergencies and problem solving",icon:"🚨",body:()=>`<p>Astronauts prepare for <b>fire, sudden loss of cabin pressure and toxic air</b>. In simulators, instructors <b>secretly add failures</b> to test the crew and the flight controllers in Mission Control. The aim is to make the right response <b>calm and almost automatic</b>.</p><p>History shows why. On <b>Apollo 13</b> (1970), the crew and engineers on the ground built a carbon dioxide filter out of spare parts. During the <b>Apollo 11</b> landing, a computer alarm sounded and Mission Control correctly called “Go”. In 2015, an ISS ammonia alarm sent the crew to the Russian segment until controllers checked for a leak.</p><p>In Mission Control, the <b>CAPCOM</b> is an astronaut who talks to the crew, so the message comes from someone who understands their job.</p>`,fact:"Astronauts rehearse the same emergencies many times so checklists feel familiar.",q:"Why do crews rehearse failures in simulators over and over?",o:["So the right response is calm and almost automatic","To make the simulator break","To save fuel","For fun"],c:0,why:"Practice under pressure builds calm, fast responses that work when the real emergency comes."},
 {t:"Teamwork, language and robots",icon:"🤝",body:()=>`<p>The ISS is run by five space agencies: <b>NASA, Roscosmos, ESA, JAXA and the Canadian Space Agency</b>. NASA astronauts learn <b>Russian</b> so they can work with Russian crew and understand Soyuz and Russian segment systems.</p><p>To practise living and working as a team, astronauts take expedition training in remote wilderness and spend time in an <b>undersea habitat</b> (NASA's NEEMO missions). They also learn to operate the station's <b>Canadarm2 robotic arm</b> and many other systems.</p><p>Teamwork skills such as clear communication, sharing the workload and speaking up about safety are trained as seriously as technical skills.</p>`,fact:"Astronauts also spend a lot of time learning each other's experiments and jobs so they can step in.",q:"Why do NASA astronauts learn Russian?",o:["The ISS is an international partnership and many systems and crew are Russian","Because NASA is in Russia","It is easy","So they can read the Moon"],c:0,why:"The station is built and operated by several nations, and Russian is a working language aboard."},
 {t:"Training for the Moon",icon:"🌙",body:()=>`<p>Apollo crews trained with geologists on field trips to <b>lava fields, volcanic craters and impact craters</b> such as Meteor Crater in Arizona. They learned to <b>recognize rock types, take careful notes and photographs, and collect the most valuable samples</b> in a few hours. The last Apollo crew included geologist Harrison “Jack” Schmitt.</p><p>On the Moon, gravity is about <b>one sixth of Earth's</b>, so astronauts bound instead of walk. The suit is stiff, lunar dust is sharp and sticky, and radio signals take about <b>1.3 seconds</b> each way to Earth. NASA's <b>Artemis program</b> plans to land astronauts near the Moon's south pole, where ice may hide in shadowed craters.</p>`,fact:"Apollo astronauts brought back about 382 kg of Moon rock and soil.",q:"Why did Apollo astronauts do geology field training?",o:["To recognize and collect the most scientifically valuable rocks","To learn to drive","To practise cooking","To find gold"],c:0,why:"Limited time on the Moon meant they had to choose the best samples quickly, so geology training mattered."}
];
let TQ={phase:"learn",tried:[],ok:false};
function startTraining(){S.phase="training";S.train=S.train||{i:0,score:0,done:false};save();go("training")}
function renderTraining(){
  const T=S.train||(S.train={i:0,score:0,done:false});
  if(T.i>=LESSONS.length)return `<div class="card"><h2>🎓 Astronaut training complete!</h2><p>You passed all ${LESSONS.length} lessons of astronaut training and answered <b>${T.score}</b> of ${LESSONS.length} quiz questions correctly on the first try.</p><div class="debrief"><b>🏅 Certificate of Astronaut Training</b><br>Awarded for completing a course based on real NASA astronaut training: selection, underwater spacewalk practice, survival and flying, weightlessness, health, radiation, life support, emergencies, teamwork and Moon geology.</div><p class="good">Bonus: +${T.score*5} Science Points.</p><button class="primary" onclick="finishTraining()">Next: how to play →</button></div>`;
  const L=lessonFor(T.i),head=`<div class="row spread"><h2>🎓 Astronaut training: lesson ${T.i+1} of ${LESSONS.length}</h2><button class="sm" onclick="skipTraining()">Skip training</button></div><div class="bar blue" style="margin:6px 0"><i style="width:${Math.round(T.i/LESSONS.length*100)}%"></i></div>`;
  if(TQ.phase!=="quiz")return `<div class="card">${head}<p class="small muted">Step 1 of 2: learn how real astronauts train. A quiz comes next.</p><h3>${L.icon} ${esc(L.t)}</h3>${L.body()}${trainArt(T.i)}<div class="debrief"><b>💡 Did you know?</b><br>${esc(L.fact)}</div><button class="primary" onclick="startQuiz2()">I'm ready. Take the quiz →</button></div>`;
  return `<div class="card">${head}<p class="small muted">Step 2 of 2: quiz on “${esc(L.t)}”.</p><p><b>${esc(L.q)}</b></p>${L.o.map((x,j)=>`<button class="opt ${TQ.ok&&j===L.c?"sel":""}" ${TQ.ok||TQ.tried.includes(j)?"disabled":""} onclick="trainAnswer(${j})">${esc(x)}</button>`).join("")}${TQ.tried.length&&!TQ.ok?`<p class="bad small">Not quite. Try another answer, or review the lesson.</p>`:""}${TQ.ok?`<div class="debrief"><b class="good">Correct!</b> ${esc(L.why)}</div><button class="primary" onclick="trainNext()">${T.i+1<LESSONS.length?"Next lesson →":"Finish training →"}</button>`:`<button class="sm" onclick="reviewLesson()">📖 Review the lesson</button>`}</div>`}
function startQuiz2(){TQ={phase:"quiz",tried:[],ok:false};render();window.scrollTo(0,0)}
function reviewLesson(){TQ.phase="learn";render();window.scrollTo(0,0)}
function trainAnswer(j){const L=lessonFor(S.train.i);if(j===L.c){if(!TQ.tried.length)S.train.score++;TQ.ok=true}else TQ.tried.push(j);save();render()}
function trainNext(){S.train.i++;TQ={phase:"learn",tried:[],ok:false};save();render();window.scrollTo(0,0)}
function skipTraining(){S.train.i=LESSONS.length;S.train.score=0;TQ={phase:"learn",tried:[],ok:false};finishTraining()}
function finishTraining(){const T=S.train;if(!T.done){T.done=true;S.sp+=T.score*5}TQ={phase:"learn",tried:[],ok:false};S.phase="howto";save();go("howto")}
/* ============ HOW TO PLAY (separate quick guide) ============ */
function renderHowTo(){
  const c=(i,t,b)=>`<div class="card" style="margin:0"><h3>${i} ${t}</h3><p class="small">${b}</p></div>`;
  return `<div class="card"><h2>🎮 How to play Outpost 7</h2><p class="muted">A quick guide to the game. (Training taught you how real astronauts prepare. This page is about the game itself.) The full rulebook is the 📖 button at the top.</p>
  <div class="grid">${c("🎯","The goal",`Survive ${NIGHTS} days, bring home ${MD().samp} rock samples and stay under ${RADMAX} mSv of radiation.`)}${c("⏱️","Your day",`You get hours every morning. Spend them on Maintain, Science, Explore, Build or Mission tabs, then press End the day.`)}${c("📊","The meters",`Keep oxygen, water, food, power, health and morale up. Oxygen at 0 ends the mission.`)}${c("🌗","Dark days",`Days 1 to 15 are sunlit. Days 16 to ${NIGHTS} are dark, so solar panels stop. Build a reactor and batteries before then.`)}${c("☢️","Radiation",`It adds up. Shelter from storms and build shielding. 120 mSv makes you sick and ${RADMAX} mSv ends the mission.`)}${c("🏗️","Building",`In the Build tab, type what you want to build, pick a material, then spend hours and power to finish it.`)}${c("🧭","Exploring",`Trips outside cost hours, oxygen and a little radiation. Visit sample sites, then load samples into the capsule.`)}${c("🎲","Problems",`Major problems strike often. Every choice costs something. After you choose, you learn the real NASA story.`)}${c("📈","The Data tab",`Charts show your meters, materials, power and radiation over time so you can plan ahead.`)}</div>
  <div class="row" style="margin-top:12px"><button class="primary" onclick="startDay()">🚀 Begin Day 1 →</button><button onclick="openManual()">📖 Open the full manual</button></div></div>`}

/* ============ SCENE ============ */
function modSVG(k,x,gy,sc){const m=MODK[k],c1=m.c[0],c2=m.c[1],sh=m.sh;let b="";
  if(sh==="dome")b=`<path d="M-22,0 A22,20 0 0 1 22,0Z" fill="${c1}" stroke="rgba(0,0,0,.4)"/>`;
  else if(sh==="box")b=`<rect x="-24" y="-24" width="48" height="24" rx="3" fill="${c1}" stroke="rgba(0,0,0,.4)"/>`;
  else if(sh==="tank")b=`<rect x="-24" y="-22" width="20" height="22" rx="7" fill="${c1}"/><rect x="4" y="-22" width="20" height="22" rx="7" fill="${c2}"/>`;
  else if(sh==="panel")b=`<path d="M-26,-6 L-18,-30 L26,-30 L22,-6Z" fill="${c1}"/><path d="M0,0 V-8" stroke="#9aa3bf" stroke-width="3"/>`;
  else if(sh==="mound")b=`<path d="M-30,0 Q0,-34 30,0Z" fill="${c1}"/>`;
  else if(sh==="reactor")b=`<rect x="-8" y="-34" width="16" height="34" fill="${c1}"/><path d="M-20,-8 H20 M-16,-18 H16" stroke="#9aa3bf" stroke-width="3"/><circle cx="0" cy="-36" r="5" fill="#fbbf24"/>`;
  else if(sh==="mast")b=`<path d="M0,0 V-40" stroke="#cbd0e6" stroke-width="3"/><circle cx="0" cy="-42" r="5" fill="${c1}"/>`;
  else if(sh==="dish")b=`<path d="M0,0 V-18" stroke="#9aa3bf" stroke-width="4"/><ellipse cx="0" cy="-28" rx="22" ry="12" fill="${c1}" transform="rotate(-20 0 -28)"/>`;
  return `<g transform="translate(${x},${gy}) scale(${sc})">${b}<text y="-6" text-anchor="middle" font-size="14">${m.icon}</text></g>`}
function baseScene(night){
